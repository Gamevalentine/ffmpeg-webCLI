<style>
:root{--bg:#0b0c0f;--p:#111318;--p2:#171a20;--p3:#20242b;--line:#2a2f37;--text:#f3f5f7;--muted:#8d97a3;--a:#5eead4;--a2:#22d3ee}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:500 13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{color:inherit}.app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr) 248px}.top{display:flex;align-items:center;gap:9px;padding:0 14px;background:#0e1014;border-bottom:1px solid var(--line)}.logo{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a2));color:#07110f;font-weight:900}.brand{font-weight:800}.project{margin-left:18px;color:#aeb7c1}.project input{width:180px;border:0;border-bottom:1px solid transparent;background:transparent;color:#fff;padding:5px;outline:0}.project input:focus{border-color:#47515c}.ib{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:#9aa5b0;cursor:pointer}.ib:hover{background:var(--p2);color:#fff}.status{margin-left:auto;color:#84e7ba;font-size:11px}.status:before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#4ad295}.export{border:0;border-radius:8px;padding:9px 16px;font-weight:800;cursor:pointer;color:#06110f;background:linear-gradient(135deg,var(--a),var(--a2))}.export:disabled{opacity:.35;cursor:not-allowed}.work{min-height:0;display:grid;grid-template-columns:72px 270px minmax(360px,1fr) 330px}.rail{padding:7px 6px;background:#0e1014;border-right:1px solid var(--line);overflow:auto}.rail button{width:100%;min-height:55px;border:0;border-radius:9px;background:transparent;color:#8d97a3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;cursor:pointer}.rail button b{font-size:18px}.rail button:hover{background:#15181d;color:#fff}.rail button.active{background:#172321;color:var(--a)}.library{background:var(--p);border-right:1px solid var(--line);overflow:auto}.head{height:46px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line)}.head span{margin-left:auto;color:var(--muted);font-size:10px}.libbody{padding:10px}.import{width:100%;height:96px;border:1px dashed #3c444e;border-radius:9px;background:#171a1f;color:#aab3bd;display:grid;place-items:center;cursor:pointer}.import:hover{border-color:var(--a);background:#172321}.import b{display:block;font-size:26px}.import small{display:block;color:#75808c;margin-top:4px}.media{margin-top:9px;padding:7px;border:1px solid #262c33;border-radius:8px;background:#16191e;display:grid;grid-template-columns:58px 1fr;gap:8px}.thumb{height:38px;border-radius:5px;background:#050607;display:grid;place-items:center;color:#65707b}.mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.meta{font-size:9px;color:#74808c;margin-top:3px}.toolcard{padding:10px;border:1px solid #272d34;border-radius:8px;background:#16191e;margin-bottom:8px}.toolcard p{margin:0 0 8px;color:#9ba5b0;font-size:11px}.toolcard button{width:100%;border:0;border-radius:7px;background:#252b32;padding:8px;cursor:pointer}.center{min-width:0;min-height:0;padding:12px;background:#08090b;display:grid;grid-template-rows:30px minmax(0,1fr) 42px}.prehead{display:flex;align-items:center;color:#96a0ac;font-size:11px}.prehead span:last-child{margin-left:auto;color:#6cd8c9}.stage{position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid #20242a;border-radius:9px;background:#030405}.empty{text-align:center;color:#68737e}.empty b{display:block;font-size:35px;color:#343a42}.empty strong{display:block;color:#9aa4af;margin-top:7px;font-size:12px}.empty small{font-size:10px}.vwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.vwrap.hidden{display:none}.vwrap video{max-width:100%;max-height:100%;width:auto;height:auto;transform-origin:center;background:#000}.txt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:4px 8px;color:#fff;font-size:28px;font-weight:800;text-shadow:0 1px 4px #000;cursor:move}.transport{display:flex;align-items:center;justify-content:center;gap:4px}.transport button{width:31px;height:31px;border:0;border-radius:7px;background:transparent;color:#9ba6b1;cursor:pointer}.transport button:hover{background:#171a1f;color:#fff}.transport .play{width:34px;height:34px;border-radius:50%;background:#edf1f4;color:#090a0c}.time{font:500 10px ui-monospace,Consolas,monospace;margin-left:7px;color:#aab3bd}.ins{background:var(--p);border-left:1px solid var(--line);overflow:auto}.tabs{height:46px;display:flex;align-items:center;gap:3px;padding:0 10px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:6px;background:transparent;color:#89939f;padding:6px 10px;font-size:10px}.tabs button.active{background:#24282e;color:#fff}.insbody{padding:12px}.sec{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #242a31}.sec h3{margin:0 0 9px;font-size:11px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{padding:7px;border:1px solid #30363e;border-radius:7px;background:#0e1014}.mini label{font-size:9px;color:#7f8995}.mini input{width:100%;margin-top:3px;border:0;background:transparent;color:#fff;outline:0}.row{display:grid;grid-template-columns:66px 1fr 52px;gap:8px;align-items:center;margin:8px 0}.row label{font-size:10px;color:#89939f}.row input[type=range]{width:100%;accent-color:var(--a)}.row input[type=number]{width:52px;padding:5px;border:1px solid #30363e;border-radius:6px;background:#0e1014;color:#fff}.timeline{min-height:0;padding:0 10px 10px;background:#0e1013;border-top:1px solid var(--line);display:grid;grid-template-rows:38px minmax(0,1fr)}.tlbar{display:flex;align-items:center;gap:4px}.tlbar strong{font-size:11px;margin-right:8px}.tlbar button{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:#9aa5b0;cursor:pointer}.tlbar button:hover{background:#191c21;color:#fff}.zoom{margin-left:auto;display:flex;gap:6px;align-items:center;color:#7f8995;font-size:9px}.tlbody{min-height:0;display:grid;grid-template-columns:54px 1fr;overflow:hidden}.labels{padding-top:24px;border-right:1px solid #272c33}.lab{height:42px;display:grid;place-items:center;border-bottom:1px solid #171a1f;color:#75808b;font-size:10px}.tracks{position:relative;overflow:auto;background:#0b0d10}.ruler{position:sticky;top:0;z-index:4;height:24px;border-bottom:1px solid #20242a;background:repeating-linear-gradient(90deg,#343a42 0 1px,#0b0d10 1px 50px)}.track{position:relative;height:42px;border-bottom:1px solid #171a1f}.clip{position:absolute;top:5px;height:32px;min-width:34px;border:1px solid #3d827a;border-radius:6px;background:linear-gradient(90deg,#17302d,#19383a);overflow:hidden;cursor:grab}.clip.selected{outline:1px solid var(--a)}.clip.audio{border-color:#6651a8;background:linear-gradient(90deg,#29213f,#39285c)}.clip.text{border-color:#b2743a;background:linear-gradient(90deg,#3d291a,#5a381c)}.cname{padding:5px 9px;color:#c7fff6;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip:after{content:"";position:absolute;left:0;right:0;bottom:4px;height:5px;opacity:.5;background:repeating-linear-gradient(90deg,#4fb5aa 0 3px,transparent 3px 6px)}.handle{position:absolute;top:0;bottom:0;width:7px;background:rgba(94,234,212,.55);cursor:ew-resize;z-index:2}.handle.l{left:0}.handle.r{right:0}.ph{position:absolute;top:0;bottom:0;width:1px;background:#fff;z-index:20;pointer-events:none}.ph:before{content:"";position:absolute;left:-5px;top:0;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #fff}.toast{position:fixed;left:50%;bottom:264px;transform:translateX(-50%) translateY(10px);padding:9px 13px;border:1px solid #343a42;border-radius:8px;background:#20242a;color:#dce2e8;font-size:11px;opacity:0;transition:.18s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#file,#audio{display:none}@media(max-width:1180px){.work{grid-template-columns:62px 220px minmax(320px,1fr) 290px}.project{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">▶</div><div class="brand">Video Studio</div><div class="project">Project <input id="project" value="Untitled project"></div><button class="ib" id="undo">↶</button><button class="ib" id="redo">↷</button><div class="status" id="status">100% local</div><button class="export" id="export" disabled>Export</button></header>
<section class="work">
<nav class="rail" id="rail"><button class="active" data-s="media"><b>▣</b>Media</button><button data-s="audio"><b>♫</b>Audio</button><button data-s="text"><b>T</b>Text</button><button data-s="stickers"><b>✦</b>Stickers</button><button data-s="effects"><b>✧</b>Effects</button><button data-s="transitions"><b>⇄</b>Transitions</button><button data-s="captions"><b>CC</b>Captions</button><button data-s="filters"><b>◫</b>Filters</button></nav>
<aside class="library"><div class="head"><strong id="ltitle">Media</strong><span id="lsub">Local files</span></div><div class="libbody" id="lib"></div></aside>
<main class="center"><div class="prehead"><span>Preview</span><span>Local • No upload</span></div><div class="stage" id="stage"><div class="empty" id="empty"><b>▣</b><strong>Add a video to start editing</strong><small>Import from Media</small></div><div class="vwrap hidden" id="vwrap"><video id="video" playsinline></video></div><div class="txt" id="txt" contenteditable="true" hidden>Text</div></div><div class="transport"><button id="back">|◀</button><button class="play" id="play">▶</button><button id="forward">▶|</button><span class="time" id="time">00:00 / 00:00</span></div></main>
<aside class="ins"><div class="tabs"><button class="active">Video</button><button>Audio</button><button>Speed</button></div><div class="insbody"><div class="sec"><h3>Transform</h3><div class="pair"><div class="mini"><label>Position X</label><input id="x" type="number" value="0"></div><div class="mini"><label>Position Y</label><input id="y" type="number" value="0"></div></div><div class="row"><label>Scale</label><input id="scale" type="range" min="25" max="250" value="100"><input id="scaleN" type="number" value="100"></div><div class="row"><label>Rotation</label><input id="rot" type="range" min="-180" max="180" value="0"><input id="rotN" type="number" value="0"></div></div><div class="sec"><h3>Compositing</h3><div class="row"><label>Opacity</label><input id="op" type="range" min="0" max="100" value="100"><input id="opN" type="number" value="100"></div></div><div class="sec"><h3>Audio</h3><div class="row"><label>Volume</label><input id="vol" type="range" min="0" max="200" value="100"><input id="volN" type="number" value="100"></div></div><div class="sec"><h3>Speed</h3><div class="row"><label>Speed</label><input id="speed" type="range" min="50" max="200" value="100"><input id="speedN" type="number" value="100"></div></div></div></aside>
</section>
<section class="timeline"><div class="tlbar"><strong>Timeline</strong><button id="split">✂</button><button id="del">⌫</button><button>⌁</button><div class="zoom">Zoom <input id="zoom" type="range" min="60" max="220" value="100"></div></div><div class="tlbody"><div class="labels"><div class="lab">V1</div><div class="lab">V2</div><div class="lab">T1</div><div class="lab">A1</div></div><div class="tracks" id="tracks"><div class="ruler" id="ruler"></div><div class="track" id="V1"></div><div class="track" id="V2"></div><div class="track" id="T1"></div><div class="track" id="A1"></div><div class="ph" id="ph"></div></div></div></section>
</div><input id="file" type="file" accept="video/*"><input id="audio" type="file" accept="audio/*"><div class="toast" id="toast"></div>
<script type="module">
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],v=$('#video');
const S={file:null,url:null,dur:0,start:0,end:0,zoom:1,scale:1,rot:0,op:1,vol:1,speed:1,x:0,y:0,clips:[],sel:null,ff:null,fetchFile:null,loaded:false,h:[],f:[]};
const fmt=s=>{if(!Number.isFinite(s))return'00:00';return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),1800)}
function snap(){return{scale:S.scale,rot:S.rot,op:S.op,vol:S.vol,speed:S.speed,x:S.x,y:S.y,start:S.start,end:S.end}}function hist(){S.h.push(snap());if(S.h.length>30)S.h.shift();S.f=[]}function apply(o){Object.assign(S,o);sync();preview();timeline()}$('#undo').onclick=()=>{if(S.h.length){S.f.push(snap());apply(S.h.pop())}};$('#redo').onclick=()=>{if(S.f.length){S.h.push(snap());apply(S.f.pop())}};
const tools={media:'<button class="import" id="imp"><div><b>＋</b>Import media<small>MP4, MOV, WebM, AVI…</small></div></button><div id="ml"></div>',audio:'<div class="toolcard"><p>Add a local audio track.</p><button id="impa">Import audio</button></div>',text:'<div class="toolcard"><p>Add an editable text layer.</p><button id="addt">Add text</button></div>',stickers:'<div class="toolcard"><p>Sticker layer UI is ready.</p><button disabled>Sticker library</button></div>',effects:'<div class="toolcard"><p>Effects render locally with FFmpeg.</p><button disabled>Effects</button></div>',transitions:'<div class="toolcard"><p>Split clips before adding transitions.</p><button id="spl2">Split at playhead</button></div>',captions:'<div class="toolcard"><p>Caption panel prepared for local Whisper.</p><button disabled>Auto captions</button></div>',filters:'<div class="toolcard"><p>Reset visual transform.</p><button id="reset">Reset</button></div>'};
function section(k){$$('#rail button').forEach(b=>b.classList.toggle('active',b.dataset.s===k));const n={media:'Media',audio:'Audio',text:'Text',stickers:'Stickers',effects:'Effects',transitions:'Transitions',captions:'Captions',filters:'Filters'};$('#ltitle').textContent=n[k];$('#lsub').textContent=k==='media'?'Local files':'Tools';$('#lib').innerHTML=tools[k];$('#imp')?.addEventListener('click',()=>$('#file').click());$('#impa')?.addEventListener('click',()=>$('#audio').click());$('#addt')?.addEventListener('click',addText);$('#spl2')?.addEventListener('click',split);$('#reset')?.addEventListener('click',()=>{hist();Object.assign(S,{scale:1,rot:0,op:1,x:0,y:0});sync();preview()});mediaCard()}$$('#rail button').forEach(b=>b.onclick=()=>section(b.dataset.s));section('media');
function mediaCard(){const e=$('#ml');if(!e)return;e.innerHTML=S.file?'<div class="media"><div class="thumb">▶</div><div><div class="mname">'+esc(S.file.name)+'</div><div class="meta">'+fmt(S.dur)+' • local</div></div></div>':''}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(S.url)URL.revokeObjectURL(S.url);S.file=f;S.url=URL.createObjectURL(f);v.src=S.url;v.load();$('#vwrap').classList.remove('hidden');$('#empty').hidden=true;$('#export').disabled=false;v.onloadedmetadata=()=>{S.dur=v.duration||0;S.start=0;S.end=S.dur;const c={id:crypto.randomUUID(),start:0,end:S.dur,track:'V1',name:f.name};S.clips=[c];S.sel=c.id;timeline();mediaCard();time();msg('Video added')}};
$('#audio').onchange=e=>{const f=e.target.files[0];if(!f)return;S.clips.push({id:crypto.randomUUID(),start:0,end:Math.max(S.dur,30),track:'A1',name:f.name,audio:true});timeline();msg('Audio track added')};
function preview(){v.style.transform='translate('+S.x+'px,'+S.y+'px) scale('+S.scale+') rotate('+S.rot+'deg)';v.style.opacity=S.op;v.volume=Math.max(0,Math.min(1,S.vol));v.playbackRate=S.speed}
function bind(r,n,k,d=1){const a=$('#'+r),b=$('#'+n);a.oninput=()=>{S[k]=+a.value/d;b.value=a.value;preview()};a.onchange=hist;b.onchange=()=>{hist();S[k]=+b.value/d;a.value=b.value;preview()}}bind('scale','scaleN','scale',100);bind('rot','rotN','rot');bind('op','opN','op',100);bind('vol','volN','vol',100);bind('speed','speedN','speed',100);['x','y'].forEach(k=>$('#'+k).onchange=e=>{hist();S[k]=+e.target.value;preview()});
function sync(){$('#scale').value=$('#scaleN').value=Math.round(S.scale*100);$('#rot').value=$('#rotN').value=Math.round(S.rot);$('#op').value=$('#opN').value=Math.round(S.op*100);$('#vol').value=$('#volN').value=Math.round(S.vol*100);$('#speed').value=$('#speedN').value=Math.round(S.speed*100);$('#x').value=S.x;$('#y').value=S.y}
$('#play').onclick=()=>v.paused?v.play():v.pause();$('#back').onclick=()=>v.currentTime=Math.max(S.start,v.currentTime-5);$('#forward').onclick=()=>v.currentTime=Math.min(S.end||S.dur,v.currentTime+5);v.onplay=()=>$('#play').textContent='❚❚';v.onpause=()=>$('#play').textContent='▶';v.ontimeupdate=()=>{if(S.end&&v.currentTime>S.end){v.pause();v.currentTime=S.end}time();head()};function time(){$('#time').textContent=fmt(v.currentTime)+' / '+fmt(S.dur)}
const pps=()=>Math.max(7,12*S.zoom);function timeline(){const w=Math.max($('#tracks').clientWidth,S.dur*pps()+120);['V1','V2','T1','A1','ruler'].forEach(id=>$('#'+id).style.width=w+'px');$$('.track').forEach(t=>t.innerHTML='');S.clips.forEach(c=>{const tr=$('#'+c.track);if(!tr)return;const e=document.createElement('div');e.className='clip '+(c.audio?'audio ':'')+(c.text?'text ':'')+(S.sel===c.id?'selected':'');e.style.left=c.start*pps()+'px';e.style.width=Math.max(34,(c.end-c.start)*pps())+'px';e.innerHTML='<span class="handle l"></span><div class="cname">'+esc(c.name)+'</div><span class="handle r"></span>';e.onclick=x=>{x.stopPropagation();S.sel=c.id;timeline()};drag(e,c);trim(e.querySelector('.l'),c,'l');trim(e.querySelector('.r'),c,'r');tr.appendChild(e)});head()}
function drag(e,c){e.onpointerdown=x=>{if(x.target.classList.contains('handle'))return;const ox=x.clientX,s=c.start,en=c.end;e.setPointerCapture(x.pointerId);e.onpointermove=m=>{const d=(m.clientX-ox)/pps(),len=en-s;c.start=Math.max(0,s+d);c.end=c.start+len;timeline()};e.onpointerup=()=>{e.onpointermove=e.onpointerup=null}}}
function trim(h,c,side){h.onpointerdown=x=>{x.stopPropagation();const ox=x.clientX,s=c.start,en=c.end;h.setPointerCapture(x.pointerId);h.onpointermove=m=>{const d=(m.clientX-ox)/pps();if(side==='l')c.start=Math.max(0,Math.min(en-.05,s+d));else c.end=Math.max(s+.05,Math.min(S.dur||en,en+d));if(c.track==='V1'&&S.clips.filter(q=>q.track==='V1').length===1){S.start=c.start;S.end=c.end}timeline()};h.onpointerup=()=>{h.onpointermove=h.onpointerup=null}}}
$('#tracks').onpointerdown=e=>{if(e.target.closest('.clip'))return;const r=$('#tracks').getBoundingClientRect(),x=e.clientX-r.left+$('#tracks').scrollLeft;v.currentTime=Math.max(0,Math.min(S.dur,x/pps()));head()};function head(){$('#ph').style.left=v.currentTime*pps()+'px'}$('#zoom').oninput=e=>{S.zoom=+e.target.value/100;timeline()};
function split(){if(!S.file)return;const t=v.currentTime,c=S.clips.find(q=>q.id===S.sel&&q.track==='V1')||S.clips.find(q=>q.track==='V1');if(!c||t<=c.start+.05||t>=c.end-.05)return msg('Move playhead inside a clip');const n={...c,id:crypto.randomUUID(),start:t,name:c.name+' · 2'};c.end=t;S.clips.push(n);S.sel=n.id;timeline();msg('Clip split')}$('#split').onclick=split;$('#del').onclick=()=>{if(!S.sel)return;S.clips=S.clips.filter(c=>c.id!==S.sel);S.sel=S.clips[0]?.id||null;timeline()};
function addText(){const t=$('#txt');t.hidden=false;t.focus();if(!S.clips.some(c=>c.text))S.clips.push({id:crypto.randomUUID(),start:v.currentTime||0,end:Math.min(S.dur||5,(v.currentTime||0)+5),track:'T1',name:'Text',text:true});timeline();msg('Text layer added')}let tx=0,ty=0;$('#txt').onpointerdown=e=>{const x=e.clientX,y=e.clientY,sx=tx,sy=ty,el=$('#txt');el.setPointerCapture(e.pointerId);el.onpointermove=m=>{tx=sx+m.clientX-x;ty=sy+m.clientY-y;el.style.transform='translate(calc(-50% + '+tx+'px),calc(-50% + '+ty+'px))'};el.onpointerup=()=>{el.onpointermove=el.onpointerup=null}};
async function engine(){if(S.loaded)return S.ff;$('#status').textContent='Loading ffmpeg…';const [{FFmpeg},{fetchFile}]=await Promise.all([import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js'),import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js')]);const ff=new FFmpeg();ff.on('progress',({progress})=>$('#status').textContent='Rendering '+Math.max(0,Math.min(100,Math.round(progress*100)))+'%');await ff.load({coreURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.js',wasmURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.wasm'});S.ff=ff;S.fetchFile=fetchFile;S.loaded=true;$('#status').textContent='ffmpeg ready';return ff}
$('#export').onclick=async()=>{if(!S.file)return;const b=$('#export');b.disabled=true;b.textContent='Rendering…';try{const ff=await engine(),ext=(S.file.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,''),input='input.'+ext,out='video-studio.mp4';try{await ff.deleteFile(input)}catch{}try{await ff.deleteFile(out)}catch{}await ff.writeFile(input,await S.fetchFile(S.file));const a=[];if(S.start>0)a.push('-ss',String(S.start));a.push('-i',input);if(S.end>S.start&&S.end<S.dur-.01)a.push('-t',String(S.end-S.start));const vf=[];if(Math.abs(S.scale-1)>.001)vf.push('scale=iw*'+S.scale.toFixed(3)+':ih*'+S.scale.toFixed(3));if(Math.abs(S.rot)>.01)vf.push('rotate='+(S.rot*Math.PI/180).toFixed(6)+':ow=rotw(iw):oh=roth(ih):c=black');if(Math.abs(S.speed-1)>.001)vf.push('setpts=PTS/'+S.speed.toFixed(3));if(vf.length)a.push('-vf',vf.join(','));const af=[];if(Math.abs(S.vol-1)>.001)af.push('volume='+S.vol.toFixed(3));if(Math.abs(S.speed-1)>.001)af.push('atempo='+S.speed.toFixed(3));if(af.length)a.push('-af',af.join(','));a.push('-c:v','libx264','-preset','veryfast','-crf','20','-c:a','aac','-movflags','+faststart',out);const code=await ff.exec(a);if(code!==0)throw new Error('FFmpeg failed');const d=await ff.readFile(out),url=URL.createObjectURL(new Blob([d.buffer],{type:'video/mp4'})),x=document.createElement('a');x.href=url;x.download=($('#project').value||'video-studio')+'.mp4';x.click();setTimeout(()=>URL.revokeObjectURL(url),1500);msg('Export complete')}catch(e){console.error(e);msg('Export error: '+e.message)}finally{b.disabled=!S.file;b.textContent='Export';$('#status').textContent=S.loaded?'ffmpeg ready':'100% local'}};
</script>
