<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="Local browser video editor powered by ffmpeg.wasm">
  <title>Video Studio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0b0d}
    #app{display:block;width:100%;height:100%;border:0;background:#0a0b0d}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:#0a0b0d;color:#aeb7c2;font:500 13px system-ui,sans-serif;z-index:2;transition:opacity .2s}
    #boot i{width:8px;height:8px;border-radius:50%;background:#5eead4;box-shadow:0 0 16px #5eead4}
  </style>
</head>
<body>
  <div id="boot"><i></i><span>Loading local video editor…</span></div>
  <iframe id="app" src="legacy.html" title="Video Studio"></iframe>
  <script>
    (()=>{
      const frame=document.getElementById('app');
      const boot=document.getElementById('boot');
      const decorate=()=>{
        try{
          const d=frame.contentDocument;
          if(!d||!d.head)return;
          if(!d.getElementById('capcut-ui-css')){
            const link=d.createElement('link');
            link.id='capcut-ui-css';link.rel='stylesheet';link.href='capcut-ui.css?v=1';
            d.head.appendChild(link);
          }
          if(!d.getElementById('capcut-ui-js')){
            const script=d.createElement('script');
            script.id='capcut-ui-js';script.src='capcut-ui.js?v=1';script.defer=true;
            d.body.appendChild(script);
          }
          document.title='Video Studio';
        }catch(err){console.error('[studio] UI decoration failed',err)}
        boot.style.opacity='0';setTimeout(()=>boot.remove(),220);
      };
      frame.addEventListener('load',decorate);
    })();
  </script>
</body>
</html>
